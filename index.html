<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7b1d2d">
  <title>Weinkeller Scanner V4</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root{--wine:#7b1d2d;--wine2:#92263a;--bg:#f6f1ee;--card:#fff;--text:#251d1d;--muted:#6e6262;--ok:#e7f5e9;--warn:#fff4d7}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text)}
    header{position:sticky;top:0;z-index:10;background:var(--wine);color:white;padding:18px 18px;font-size:24px;font-weight:800}
    main{max-width:820px;margin:auto;padding:18px}
    .card{background:var(--card);border-radius:22px;padding:20px;margin:0 0 18px;box-shadow:0 3px 15px #0000000d}
    h2{margin:0 0 18px;font-size:28px} h3{margin:18px 0 10px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    button,.filebtn{border:0;border-radius:18px;padding:16px 18px;font-size:18px;font-weight:800;cursor:pointer;text-align:center}
    button.primary,.filebtn.primary{background:var(--wine);color:#fff}
    button.secondary,.filebtn.secondary{background:#efe4e4;color:var(--wine)}
    button.ghost{background:#eee;color:#333}
    input,select,textarea{width:100%;padding:14px 14px;border:2px solid #d9d4d2;border-radius:16px;font-size:18px;background:#fff}
    label{font-weight:700;font-size:16px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .full{grid-column:1/-1}
    .field{display:grid;gap:7px}
    #preview{width:100%;max-height:560px;object-fit:contain;border-radius:18px;display:none;margin-top:14px;background:#eee}
    #status{display:none;padding:14px;border-radius:14px;margin-top:14px;font-size:16px}
    .ok{background:var(--ok)} .warn{background:var(--warn)}
    #ocrText{white-space:pre-wrap;background:#f5f5f5;padding:12px;border-radius:12px;max-height:220px;overflow:auto;font-family:ui-monospace,monospace;font-size:13px}
    .progress{height:10px;background:#eee;border-radius:99px;overflow:hidden;margin-top:12px;display:none}.bar{height:100%;width:0;background:var(--wine)}
    .archive-item{border-top:1px solid #eee;padding:12px 0}.archive-item:first-child{border-top:0}
    .muted{color:var(--muted);font-size:14px}
    @media(max-width:620px){.grid,.actions{grid-template-columns:1fr}header{font-size:22px}h2{font-size:26px}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header>🍷 Weinkeller Scanner V4</header>
<main>
  <section class="card">
    <h2>1. Etikett erfassen</h2>
    <div class="actions">
      <label class="filebtn primary">📸 Etikett fotografieren
        <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <label class="filebtn secondary">🖼️ Foto auswählen
        <input id="galleryInput" type="file" accept="image/*" hidden>
      </label>
    </div>
    <img id="preview" alt="Etikett-Vorschau">
    <button id="analyzeBtn" class="secondary" style="width:100%;margin-top:14px" disabled>🧠 Etikett lokal analysieren</button>
    <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
    <div id="status"></div>
    <details style="margin-top:12px">
      <summary>Erkannten Rohtext anzeigen</summary>
      <div id="ocrText"></div>
    </details>
  </section>

  <section class="card">
    <h2>2. Daten prüfen</h2>
    <div class="grid">
      <div class="field full"><label>EAN / UPC</label><input id="ean" inputmode="numeric"></div>
      <div class="field"><label>Weingut</label><input id="winery"></div>
      <div class="field"><label>Jahrgang</label><input id="vintage" inputmode="numeric"></div>
      <div class="field"><label>Weinart</label>
        <select id="type"><option value=""></option><option>Weißwein</option><option>Rotwein</option><option>Rosé</option><option>Schaumwein</option><option>Likörwein</option><option>Orange Wine</option></select>
      </div>
      <div class="field"><label>Rebsorte(n)</label><input id="grapes"></div>
      <div class="field"><label>Land</label><input id="country"></div>
      <div class="field"><label>Region</label><input id="region"></div>
      <div class="field"><label>Lage / Appellation</label><input id="appellation"></div>
      <div class="field"><label>Prädikat</label><input id="predicate"></div>
      <div class="field"><label>Alkohol %</label><input id="alcohol" inputmode="decimal"></div>
      <div class="field"><label>Flaschengröße (l)</label><input id="size" inputmode="decimal" value="0,75"></div>
      <div class="field"><label>Menge</label><input id="qty" inputmode="numeric" value="1"></div>
      <div class="field"><label>Kaufpreis / Fl. (€)</label><input id="price" inputmode="decimal"></div>
      <div class="field"><label>Regal</label><input id="shelf"></div>
      <div class="field"><label>Fach</label><input id="slot"></div>
      <div class="field full"><label>Notizen</label><textarea id="notes" rows="3"></textarea></div>
    </div>
    <div class="actions" style="margin-top:18px">
      <button id="saveBtn" class="primary">💾 Wein speichern</button>
      <button id="clearBtn" class="ghost">Neu / leeren</button>
    </div>
  </section>

  <section class="card">
    <h2>3. Archiv</h2>
    <div class="actions">
      <button id="csvBtn" class="secondary">⬇️ CSV exportieren</button>
      <button id="wipeBtn" class="ghost">Archiv löschen</button>
    </div>
    <div id="archive" style="margin-top:12px"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
