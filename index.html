<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#6b1f2b">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Weinkeller Scanner</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color-scheme:light dark}
    body{margin:0;background:#f4f1ed;color:#241a1b}
    header{background:#6b1f2b;color:white;padding:18px 16px;position:sticky;top:0;z-index:4}
    header h1{margin:0;font-size:1.2rem}
    main{max-width:780px;margin:auto;padding:14px}
    .card{background:white;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 4px 18px #0001}
    button{border:0;border-radius:12px;padding:13px 16px;font-size:1rem;font-weight:700;cursor:pointer}
    .primary{background:#6b1f2b;color:white}.secondary{background:#e9dfdf;color:#4f1d25}
    .row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
    label{font-size:.82rem;font-weight:700;display:block;margin-bottom:5px}
    input,select,textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccc;border-radius:10px;font-size:1rem;background:white;color:#241a1b}
    video{width:100%;border-radius:14px;background:#111;min-height:260px}
    .status{padding:10px 12px;border-radius:10px;background:#f0ece8;margin-top:10px;font-size:.92rem}
    .good{background:#e3f4e5}.warn{background:#fff0cc}.err{background:#ffd8d8}
    table{width:100%;border-collapse:collapse;font-size:.9rem} th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}
    .hidden{display:none!important}
    @media (prefers-color-scheme:dark){
      body{background:#171314;color:#f7eeee}.card{background:#241d1f}
      input,select,textarea{background:#181416;color:white;border-color:#4a3d40}
      .secondary{background:#443438;color:white}.status{background:#31282a}
      th,td{border-color:#3b3033}
    }
  </style>
</head>
<body>
<header>
  <h1>🍷 Weinkeller Scanner</h1>
</header>
<main>
  <section class="card">
    <div class="row">
      <button class="primary" id="startBtn">📷 Barcode scannen</button>
      <button class="secondary" id="stopBtn">Stop</button>
    </div>
    <div id="scannerBox" class="hidden" style="margin-top:12px">
      <video id="video" playsinline muted></video>
      <div id="scanStatus" class="status">Kamera wird vorbereitet …</div>
    </div>
    <div style="margin-top:12px">
      <label>Oder Barcode manuell eingeben</label>
      <div class="row">
        <input id="manualCode" inputmode="numeric" placeholder="EAN / UPC">
        <button class="secondary" id="lookupBtn">Suchen</button>
      </div>
    </div>
    <div id="envStatus" class="status"></div>
  </section>

  <section class="card">
    <h2 style="margin-top:0">Flasche</h2>
    <div class="grid">
      <div class="full"><label>EAN / UPC</label><input id="ean" readonly></div>
      <div><label>Weingut</label><input id="producer"></div>
      <div><label>Wein</label><input id="wine"></div>
      <div><label>Jahrgang</label><input id="vintage" type="number" min="1800" max="2100"></div>
      <div><label>Weinart</label><select id="type"><option></option><option>Weißwein</option><option>Rotwein</option><option>Rosé</option><option>Schaumwein</option><option>Süßwein</option><option>Likörwein</option><option>Orange Wine</option><option>Sonstige</option></select></div>
      <div><label>Rebsorte(n)</label><input id="grape"></div>
      <div><label>Land</label><input id="country"></div>
      <div><label>Region</label><input id="region"></div>
      <div><label>Appellation</label><input id="appellation"></div>
      <div><label>Alkohol %</label><input id="alcohol" type="number" step="0.1"></div>
      <div><label>Flaschengröße (l)</label><input id="size" type="number" step="0.01" value="0.75"></div>
      <div><label>Menge</label><input id="qty" type="number" min="1" value="1"></div>
      <div><label>Kaufpreis / Fl. (€)</label><input id="price" type="number" step="0.01"></div>
      <div><label>Regal</label><input id="rack"></div>
      <div><label>Fach</label><input id="bin"></div>
      <div class="full"><label>Notizen</label><textarea id="notes" rows="2"></textarea></div>
    </div>
    <div id="lookupStatus" class="status">Noch kein Barcode gescannt.</div>
    <div class="row" style="margin-top:12px">
      <button class="primary" id="saveBtn">➕ Einlagern</button>
      <button class="secondary" id="clearBtn">Leeren</button>
    </div>
  </section>

  <section class="card">
    <div class="row" style="align-items:center">
      <h2 style="margin:0;flex:2">Bestand</h2>
      <button class="secondary" id="exportBtn">CSV exportieren</button>
    </div>
    <div id="summary" class="status" style="margin:12px 0">0 Flaschen</div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Wein</th><th>Jahrgang</th><th>EAN</th><th>Menge</th><th>Lager</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
