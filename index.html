<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1d2d"><title>Weinkeller Scanner V5</title><link rel="manifest" href="manifest.webmanifest"><style>body{margin:0;background:#f6f1ee;font-family:system-ui;color:#251d1d}header{position:sticky;top:0;background:#7b1d2d;color:#fff;padding:20px;font-size:25px;font-weight:800}main{max-width:800px;margin:auto;padding:18px}.card{background:#fff;border-radius:22px;padding:20px;margin-bottom:18px}h2{font-size:28px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.full{grid-column:1/-1}label{font-weight:700}input,select,textarea{padding:14px;border:2px solid #d9d4d2;border-radius:16px;font-size:18px;width:100%;box-sizing:border-box}button,.filebtn{display:block;border:0;border-radius:18px;padding:16px;font-size:18px;font-weight:800;text-align:center;margin:10px 0;background:#efe4e4;color:#7b1d2d}.primary{background:#7b1d2d!important;color:#fff!important}#preview{display:none;width:100%;max-height:600px;object-fit:contain;border-radius:18px}.progress{height:10px;background:#eee;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:#7b1d2d}#status{padding:12px;background:#e7f5e9;border-radius:12px;margin-top:10px}#ocrText{white-space:pre-wrap;font-size:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script></head><body><header>🍷 Weinkeller Scanner V5</header><main><section class="card"><h2>1. Etikett erfassen</h2><label class="filebtn primary">📸 Etikett fotografieren<input id="cameraInput" type="file" accept="image/*" capture="environment" hidden></label><label class="filebtn">🖼️ Foto auswählen<input id="galleryInput" type="file" accept="image/*" hidden></label><img id="preview"><button id="analyzeBtn" disabled>🧠 Etikett lokal analysieren</button><div class="progress"><div id="bar" class="bar"></div></div><div id="status">V5 nutzt mehrere Bildvarianten für die Erkennung.</div><details><summary>Erkannten Rohtext anzeigen</summary><div id="ocrText"></div></details></section><section class="card"><h2>2. Daten prüfen</h2><div class="grid">
<div class="field full"><label>EAN / UPC</label><input id="ean"></div><div class="field"><label>Weingut</label><input id="winery"></div><div class="field"><label>Jahrgang</label><input id="vintage"></div><div class="field"><label>Weinart</label><select id="type"><option></option><option>Weißwein</option><option>Rotwein</option><option>Rosé</option><option>Schaumwein</option></select></div><div class="field"><label>Rebsorte(n)</label><input id="grapes"></div><div class="field"><label>Land</label><input id="country"></div><div class="field"><label>Region</label><input id="region"></div><div class="field"><label>Lage / Appellation</label><input id="appellation"></div><div class="field"><label>Prädikat</label><input id="predicate"></div><div class="field"><label>Alkohol %</label><input id="alcohol"></div><div class="field"><label>Flaschengröße (l)</label><input id="size" value="0,75"></div><div class="field"><label>Menge</label><input id="qty" value="1"></div><div class="field"><label>Kaufpreis / Fl. (€)</label><input id="price"></div><div class="field"><label>Regal</label><input id="shelf"></div><div class="field"><label>Fach</label><input id="slot"></div><div class="field full"><label>Notizen</label><textarea id="notes"></textarea></div></div><button id="saveBtn" class="primary">💾 Wein speichern</button><button id="clearBtn">Neu / leeren</button></section><section class="card"><h2>3. Archiv</h2><button id="csvBtn">⬇️ CSV exportieren</button><div id="archive"></div></section></main><script src="app.js"></script></body></html>
