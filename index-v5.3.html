<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#7b1d2d">
  <title>Weinkeller Scanner V5.3</title>
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f6f1ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#251d1d}
    header{position:sticky;top:0;z-index:10;background:#7b1d2d;color:#fff;padding:20px;font-size:25px;font-weight:800}
    main{max-width:800px;margin:auto;padding:18px}
    .card{background:#fff;border-radius:22px;padding:20px;margin-bottom:18px}
    h2{font-size:28px;margin:0 0 18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .field{display:grid;gap:7px;min-width:0}
    .full{grid-column:1/-1}
    label{font-weight:700}
    input,select,textarea{padding:14px;border:2px solid #d9d4d2;border-radius:16px;font-size:18px;width:100%;min-width:0;background:#fff}
    button,.filebtn{display:block;border:0;border-radius:18px;padding:16px;font-size:18px;font-weight:800;text-align:center;margin:10px 0;background:#efe4e4;color:#7b1d2d;cursor:pointer}
    .primary{background:#7b1d2d!important;color:#fff!important}
    .photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .photo-box{background:#faf7f6;border-radius:18px;padding:12px}
    .photo-box img{display:none;width:100%;height:260px;object-fit:contain;border-radius:14px;background:#eee}
    .progress{height:10px;background:#eee;border-radius:10px;overflow:hidden;margin-top:12px}
    .bar{height:100%;width:0;background:#7b1d2d}
    #status{padding:12px;background:#e7f5e9;border-radius:12px;margin-top:10px}
    #ocrText{white-space:pre-wrap;font-size:12px;max-height:300px;overflow:auto}
    .archive-item{padding:10px 0;border-top:1px solid #eee}
    .muted{font-size:13px;color:#6f6464}
    @media(max-width:420px){
      .grid{grid-template-columns:1fr 1fr;gap:10px}
      input,select,textarea{font-size:16px;padding:12px}
      .photo-grid{grid-template-columns:1fr}
      .photo-box img{height:300px}
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
<header>🍷 Weinkeller Scanner V5.3</header>
<main>
  <section class="card">
    <h2>1. Etiketten erfassen</h2>

    <div class="photo-grid">
      <div class="photo-box">
        <strong>Vorderseite</strong>
        <label class="filebtn primary" for="frontInput">📸 Vorderseite fotografieren</label>
        <input id="frontInput" type="file" accept="image/*" capture="environment" style="position:absolute;left:-10000px;width:1px;height:1px;opacity:0">
        <div id="frontTaken" class="muted" style="display:none;font-weight:800;color:#28743b">✅ Vorderseite übernommen</div>
        <img id="frontPreview" alt="Vorderseite">
      </div>

      <div class="photo-box">
        <strong>Rückseite</strong>
        <label class="filebtn" for="backInput">📸 Rückseite fotografieren</label>
        <input id="backInput" type="file" accept="image/*" capture="environment" style="position:absolute;left:-10000px;width:1px;height:1px;opacity:0">
        <div id="backTaken" class="muted" style="display:none;font-weight:800;color:#28743b">✅ Rückseite übernommen</div>
        <img id="backPreview" alt="Rückseite">
      </div>
    </div>

    <button id="analyzeBtn" disabled>🧠 Beide Etiketten lokal analysieren</button>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="status">Du kannst nur die Vorderseite oder Vorder- und Rückseite fotografieren.</div>
    <details>
      <summary>Technische Diagnose</summary>
      <div id="debug" class="muted">V5.3 geladen.</div>
    </details>
    <details>
      <summary>Erkannten Rohtext anzeigen</summary>
      <div id="ocrText"></div>
    </details>
  </section>

  <section class="card">
    <h2>2. Daten prüfen</h2>
    <div class="grid">
      <div class="field"><label>EAN / UPC</label><input id="ean"></div>
      <div class="field"><label>Weingut</label><input id="winery"></div>

      <div class="field"><label>Jahrgang</label><input id="vintage" inputmode="numeric"></div>
      <div class="field"><label>Weinart</label>
        <select id="type"><option></option><option>Weißwein</option><option>Rotwein</option><option>Rosé</option><option>Schaumwein</option></select>
      </div>

      <div class="field"><label>Rebsorte(n)</label><input id="grapes"></div>
      <div class="field"><label>Land</label><input id="country"></div>

      <div class="field"><label>Region</label><input id="region"></div>
      <div class="field"><label>Lage / Appellation</label><input id="appellation"></div>

      <div class="field"><label>Prädikat</label><input id="predicate"></div>
      <div class="field"><label>Alkohol %</label><input id="alcohol" inputmode="decimal"></div>

      <div class="field"><label>Flaschengröße (l)</label><input id="size" value="0,75"></div>
      <div class="field"><label>Menge</label><input id="qty" value="1"></div>

      <div class="field"><label>Kaufpreis / Fl. (€)</label><input id="price"></div>
      <div class="field"><label>Regal</label><input id="shelf"></div>

      <div class="field"><label>Fach</label><input id="slot"></div>
      <div class="field"><label>Notiz kurz</label><input id="notes"></div>
    </div>
    <button id="saveBtn" class="primary">💾 Wein speichern</button>
    <button id="clearBtn">Neu / leeren</button>
  </section>

  <section class="card">
    <h2>3. Archiv</h2>
    <button id="csvBtn">⬇️ CSV exportieren</button>
    <div id="archive"></div>
  </section>
</main>
<script>
const $=id=>document.getElementById(id);
let frontImage=null, backImage=null;

const GRAPES=["Riesling","Chardonnay","Sauvignon Blanc","Grauburgunder","Weißburgunder","Pinot Blanc","Pinot Gris","Gewürztraminer","Silvaner","Müller-Thurgau","Grüner Veltliner","Pinot Noir","Spätburgunder","Cabernet Sauvignon","Merlot","Cabernet Franc","Syrah","Shiraz","Grenache","Tempranillo","Sangiovese","Nebbiolo","Barbera","Malbec","Primitivo","Gamay"];
const REGIONS=[["Mosel","Deutschland"],["Rheingau","Deutschland"],["Pfalz","Deutschland"],["Nahe","Deutschland"],["Ahr","Deutschland"],["Rheinhessen","Deutschland"],["Baden","Deutschland"],["Franken","Deutschland"],["Württemberg","Deutschland"],["Bordeaux","Frankreich"],["Burgund","Frankreich"],["Bourgogne","Frankreich"],["Champagne","Frankreich"],["Rhône","Frankreich"],["Loire","Frankreich"],["Alsace","Frankreich"],["Rioja","Spanien"],["Ribera del Duero","Spanien"],["Priorat","Spanien"],["Toskana","Italien"],["Toscana","Italien"],["Piemont","Italien"],["Piemonte","Italien"],["Veneto","Italien"],["Napa Valley","USA"],["Sonoma","USA"],["Mendoza","Argentinien"],["Barossa","Australien"],["Marlborough","Neuseeland"]];
const PREDS=["Kabinett","Spätlese","Auslese","Beerenauslese","Trockenbeerenauslese","Eiswein","Großes Gewächs","Grosses Gewächs"];
const WINERIES=["Markus Molitor","Dr. Loosen","Joh. Jos. Prüm","Egon Müller","Dönnhoff","Robert Weil","Keller","Wittmann","Fritz Haag","Schloss Lieser","Clemens Busch","Van Volxem"];

const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,"").replace(/[^a-z0-9]+/g," ").trim();

function lev(a,b){
  a=norm(a);b=norm(b);
  if(!a||!b)return 0;
  let d=Array(b.length+1).fill(0).map((_,i)=>i);
  for(let i=1;i<=a.length;i++){
    let p=d;d=[i];
    for(let j=1;j<=b.length;j++)d[j]=Math.min(d[j-1]+1,p[j]+1,p[j-1]+(a[i-1]!==b[j-1]));
  }
  return 1-d[b.length]/Math.max(a.length,b.length,1);
}
const contains=(t,q)=>norm(t).includes(norm(q));

function repairVintageToken(token){
  let s=String(token).toUpperCase().replace(/\s/g,"");
  s=s.replace(/[OQ]/g,"0").replace(/[IL|]/g,"1").replace(/S/g,"5").replace(/B/g,"8");
  const m=s.match(/(19\d{2}|20\d{2})/);
  if(!m)return "";
  const y=Number(m[1]);
  return y>=1950 && y<=new Date().getFullYear()+1 ? String(y) : "";
}

function extractVintage(text){
  const direct=[...text.matchAll(/\b(19[5-9]\d|20\d{2})\b/g)].map(m=>m[0]);
  if(direct.length)return direct[0];

  const candidates=text.match(/[2ZOQ][0OQ][0-9OQILSB|]{2}|1[9OQ][0-9OQILSB|]{2}/gi)||[];
  for(const c of candidates){
    const y=repairVintageToken(c);
    if(y)return y;
  }

  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  for(const line of lines){
    const compact=line.replace(/[^0-9OQILSB|]/gi,"");
    if(compact.length>=4&&compact.length<=6){
      const y=repairVintageToken(compact);
      if(y)return y;
    }
  }
  return "";
}

async function makeBitmap(file){return await createImageBitmap(file)}
function preprocess(bitmap,mode){
  const scale=Math.min(2.2,1800/bitmap.width);
  const w=Math.max(900,Math.round(bitmap.width*scale)),h=Math.round(bitmap.height*scale);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const ctx=c.getContext("2d",{willReadFrequently:true});
  ctx.drawImage(bitmap,0,0,w,h);
  const im=ctx.getImageData(0,0,w,h),d=im.data;
  for(let i=0;i<d.length;i+=4){
    let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
    if(mode===1)g=(g-128)*1.6+128;
    if(mode===2)g=g>155?255:0;
    g=Math.max(0,Math.min(255,g));
    d[i]=d[i+1]=d[i+2]=g;
  }
  ctx.putImageData(im,0,0);
  return c;
}

async function ocrOne(file,label,start,span){
  const bm=await makeBitmap(file);
  const texts=[];
  for(let mode=0;mode<3;mode++){
    const src=preprocess(bm,mode);
    const r=await Tesseract.recognize(src,"deu+eng",{logger:m=>{
      if(m.status==="recognizing text"&&typeof m.progress==="number"){
        $("bar").style.width=(start+(mode/3)*span+(m.progress*span/3))+"%";
      }
    }});
    texts.push(`--- ${label} OCR ${mode+1} ---\n${r.data.text||""}`);
  }
  return texts;
}

function parse(text){
  const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const out={};

  out.vintage=extractVintage(text);

  out.grapes=GRAPES.find(g=>contains(text,g)||lines.some(l=>lev(l,g)>.65))||"";

  for(const [r,c] of REGIONS){
    if(contains(text,r)||lines.some(l=>lev(l,r)>.70)){out.region=r;out.country=c;break}
  }

  out.predicate=PREDS.find(p=>contains(text,p)||lines.some(l=>lev(l,p)>.65))||"";

  let best=["",0];
  for(const w of WINERIES){
    for(const l of lines){
      const s=lev(l,w);
      if(s>best[1])best=[w,s];
    }
  }
  out.winery=best[1]>.48?best[0]:"";

  if((contains(text,"erdener")||lines.some(l=>lev(l,"Erdener")>.50)) &&
     (contains(text,"treppchen")||lines.some(l=>lev(l,"Treppchen")>.45))){
    out.appellation="Erdener Treppchen";
  } else {
    out.appellation="";
    const pi=lines.findIndex(l=>PREDS.some(p=>contains(l,p)||lev(l,p)>.60));
    if(pi>0&&!/\d{4}/.test(lines[pi-1]))out.appellation=lines[pi-1];
  }

  const whites=["Riesling","Chardonnay","Sauvignon Blanc","Grauburgunder","Weißburgunder","Pinot Blanc","Pinot Gris","Gewürztraminer","Silvaner","Müller-Thurgau","Grüner Veltliner"];
  if(whites.includes(out.grapes))out.type="Weißwein";
  else if(out.grapes)out.type="Rotwein";

  let a=text.match(/(\d{1,2}(?:[.,]\d)?)\s*%?\s*(?:vol|alc)/i);
  if(!a)a=text.match(/(?:alc|alcohol)[^0-9]{0,6}(\d{1,2}(?:[.,]\d)?)/i);
  out.alcohol=a?a[1].replace(".",","):"";

  let sz=text.match(/\b(0[.,]75|0[.,]375|1[.,]5)\s*l\b/i);
  if(!sz&&/\b750\s*ml\b/i.test(text))out.size="0,75";
  else if(!sz&&/\b375\s*ml\b/i.test(text))out.size="0,375";
  else if(sz)out.size=sz[1].replace(".",",");

  const ean=(text.match(/\b\d{8,14}\b/g)||[]).find(x=>![12]\d{3}/.test(x));
  out.ean=ean||"";

  return out;
}

async function fileToDataURL(file){
  return await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}

function debug(msg){
  const d=$("debug");
  if(d) d.textContent += "\n" + msg;
}

async function setImage(file,side){
  if(!file){debug(side+": keine Datei erhalten");return;}

  try{
    debug(side+": Datei erhalten – "+file.name+" / "+file.type+" / "+file.size+" Bytes");
    if(side==="front") frontImage=file; else backImage=file;

    const dataUrl=await fileToDataURL(file);
    const preview=side==="front"?$("frontPreview"):$("backPreview");
    const taken=side==="front"?$("frontTaken"):$("backTaken");

    await new Promise((resolve,reject)=>{
      preview.onload=()=>resolve();
      preview.onerror=()=>reject(new Error("Vorschau konnte nicht geladen werden"));
      preview.src=dataUrl;
    });

    preview.style.display="block";
    if(taken)taken.style.display="block";
    $("analyzeBtn").disabled=!(frontImage||backImage);

    if(frontImage&&backImage) $("status").textContent="✅ Vorder- und Rückseite übernommen. Bereit zur Analyse.";
    else if(frontImage) $("status").textContent="✅ Vorderseite übernommen. Rückseite ist optional.";
    else $("status").textContent="✅ Rückseite übernommen. Vorderseite ist optional.";

    debug(side+": Foto erfolgreich in der App gespeichert");
  }catch(err){
    console.error(err);
    debug(side+": FEHLER – "+(err&&err.message?err.message:String(err)));
    $("status").textContent="❌ Foto konnte nicht übernommen werden. Öffne 'Technische Diagnose'.";
  }
}

$("frontInput").addEventListener("change",async e=>{
  const file=e.target.files?.[0];
  if(file)await setImage(file,"front");
});

$("backInput").addEventListener("change",async e=>{
  const file=e.target.files?.[0];
  if(file)await setImage(file,"back");
});

$("analyzeBtn").onclick=async()=>{
  if(!(frontImage||backImage))return;
  $("analyzeBtn").disabled=true;$("bar").style.width="1%";
  $("status").textContent="Vorder- und Rückseite werden zusammen ausgewertet …";
  try{
    let texts=[];
    if(frontImage)texts.push(...await ocrOne(frontImage,"VORDERSEITE",0,frontImage&&backImage?50:100));
    if(backImage)texts.push(...await ocrOne(backImage,"RÜCKSEITE",frontImage?50:0,frontImage?50:100));
    const merged=texts.join("\n\n");
    $("ocrText").textContent=merged;
    const o=parse(merged);
    for(const k of ["ean","winery","vintage","type","grapes","country","region","appellation","predicate","alcohol","size"]){
      if(o[k])$(k).value=o[k];
    }
    $("status").textContent="Analyse abgeschlossen. Vorder- und Rückseite wurden gemeinsam berücksichtigt.";
    $("bar").style.width="100%";
  }catch(e){
    console.error(e);
    $("status").textContent="Erkennung fehlgeschlagen. Bitte Foto erneut aufnehmen.";
  }finally{$("analyzeBtn").disabled=false}
};

const ids=["ean","winery","vintage","type","grapes","country","region","appellation","predicate","alcohol","size","qty","price","shelf","slot","notes"];
function formData(){let o={};ids.forEach(i=>o[i]=$(i).value);return o}
function all(){try{return JSON.parse(localStorage.winesV53||localStorage.winesV52||localStorage.winesV51||"[]")}catch{return[]}}
function saveAll(a){localStorage.winesV53=JSON.stringify(a)}
function render(){
  const a=all();
  $("archive").innerHTML=a.map(w=>`<div class="archive-item"><b>${w.winery||""} ${w.vintage||""}</b><br>${w.appellation||""} · ${w.grapes||""} · ${w.predicate||""}<div class="muted">${w.region||""} ${w.alcohol?("· "+w.alcohol+" %"):""}</div></div>`).join("")||"Noch keine Weine gespeichert.";
}
$("saveBtn").onclick=()=>{let a=all();a.unshift(formData());saveAll(a);render();$("status").textContent="Wein gespeichert."};
$("clearBtn").onclick=()=>{
  ids.forEach(i=>$(i).value="");$("size").value="0,75";$("qty").value="1";
  frontImage=backImage=null;$("frontPreview").removeAttribute("src");$("backPreview").removeAttribute("src");
  $("frontPreview").style.display="none";$("backPreview").style.display="none";$("frontTaken").style.display="none";$("backTaken").style.display="none";
  $("frontInput").value="";$("backInput").value="";$("ocrText").textContent="";
  $("analyzeBtn").disabled=true;$("bar").style.width="0";
  $("status").textContent="Du kannst nur die Vorderseite oder Vorder- und Rückseite fotografieren.";
};
$("csvBtn").onclick=()=>{
  const a=all(); if(!a.length)return;
  const q=v=>`"${String(v||"").replace(/"/g,'""')}"`;
  const csv="\uFEFF"+ids.join(";")+"\n"+a.map(w=>ids.map(i=>q(w[i])).join(";")).join("\n");
  const u=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})),l=document.createElement("a");
  l.href=u;l.download="weinkeller-v5-3.csv";l.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
};

if("serviceWorker" in navigator){
  navigator.serviceWorker.getRegistrations().then(registrations=>Promise.all(registrations.map(r=>r.unregister()))).then(()=>debug("Service Worker entfernt"));
}
if("caches" in window){
  caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).then(()=>debug("App-Caches geleert"));
}

render();

</script>
</body>
</html>
